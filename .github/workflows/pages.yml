name: Publish literary atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency security gate
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          node scripts/security-audit-policy.mjs artifacts/npm-audit.json
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node scripts/validate-static-current.mjs && node scripts/validate-drama-classics-structure.mjs && node scripts/validate-six-books-readings.mjs && node scripts/validate-sitewide-publishing-integrity.mjs
      - name: Install pinned browser-audit tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Real-browser hydration + WCAG 2.2 audit
        run: node scripts/browser-hardening.mjs && node scripts/browser-representative-pages.mjs
      - name: Upload hardening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hardening-reports
          path: artifacts
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/gajendra-preeti
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
