name: Validate bilingual atlas changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Commit regenerated lockfile and exact parity-validator repair
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/validate-home-parity.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate-home-parity.mjs')
          s=p.read_text()
          old="assert(mai.includes('प्लेटफॉर्म / META'),'Maithili 2026 milestone must carry a non-colour platform label.');"
          new="assert(mai.includes('प्लेटफॉर्म / सन्दर्भ'),'Maithili 2026 milestone must carry a localized non-colour platform label.');"
          if old not in s:
              raise SystemExit('Expected parity assertion not found')
          p.write_text(s.replace(old,new))
          PY
          npm install --package-lock-only --ignore-scripts
          git config user.name 'videha-ejournal'
          git config user.email 'ggajendra@gmail.com'
          git add package-lock.json scripts/validate-home-parity.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize dependency lock and localized parity assertion'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci
      - name: Dependency security gate
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          node scripts/security-audit-policy.mjs artifacts/npm-audit.json
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node scripts/validate-static-current.mjs
      - run: node scripts/validate-drama-classics-structure.mjs
      - run: node scripts/audit-site-bilingual.mjs
      - name: Install pinned browser-audit tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Real-browser hydration + WCAG 2.2 audit
        run: node scripts/browser-hardening.mjs
      - name: Upload hardening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-hardening-reports
          path: artifacts
          if-no-files-found: warn
