name: Validate bilingual atlas changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node scripts/validate-static.mjs
      - run: node scripts/validate-drama-classics-structure.mjs
      - run: node scripts/audit-site-bilingual.mjs
