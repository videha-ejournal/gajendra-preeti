version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      safe-minor-patch-updates:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:45'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: actions
